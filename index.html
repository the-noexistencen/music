<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Offline Music Player</title>
  
  <!-- iOS PWA Standalone Configuration -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Music">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">

  <!-- Icons & Web Manifest -->
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-title-group">
        <h1>Library</h1>
        <div class="header-subtitle" id="trackCountLabel">0 Songs</div>
      </div>
      <div class="header-actions">
        <button class="upload-btn" id="uploadBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Add MP3s
        </button>
        <input type="file" id="fileInput" multiple accept="audio/mp3,audio/*,.mp3,.m4a,.wav,.flac,.aac" style="display: none;">
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content" id="mainContent">
      <!-- Search Bar -->
      <div class="search-container">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" class="search-input" id="searchInput" placeholder="Search songs, artists...">
      </div>

      <!-- Quick Action Buttons -->
      <div class="quick-actions" id="quickActions" style="display: none;">
        <button class="action-card-btn primary" id="playAllBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          Play All
        </button>
        <button class="action-card-btn" id="shuffleAllBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"></polyline>
            <line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline>
            <line x1="15" y1="15" x2="21" y2="21"></line>
            <line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
          Shuffle All
        </button>
      </div>

      <!-- Empty State / Drop Target -->
      <div class="empty-library" id="emptyLibrary">
        <div class="empty-icon">🎵</div>
        <h3>No MP3s Found</h3>
        <p>Tap "Add MP3s" to import audio files directly from your iPhone Files, iCloud, or Downloads.</p>
        <button class="upload-btn" id="emptyUploadBtn" style="margin-top: 8px;">
          Select Audio Files
        </button>
      </div>

      <!-- Track List -->
      <div class="track-list" id="trackList"></div>

      <!-- Storage Status -->
      <div class="storage-status" id="storageStatus">
        Ad-Free • 100% Offline • Local Storage
      </div>
    </main>

    <!-- Mini Player (Bottom Dock) -->
    <div class="mini-player hidden" id="miniPlayer">
      <div class="mini-thumb" id="miniThumb">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="10 8 16 12 10 16 10 8"></polygon>
        </svg>
      </div>
      <div class="mini-info">
        <div class="mini-title" id="miniTitle">Not Playing</div>
        <div class="mini-artist" id="miniArtist">Tap to expand</div>
      </div>
      <div class="mini-controls">
        <button class="mini-ctrl-btn" id="miniPlayBtn" aria-label="Play/Pause">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" id="miniPlayIcon">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
        </button>
        <button class="mini-ctrl-btn" id="miniNextBtn" aria-label="Next Track">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 4 15 12 5 20 5 4"></polygon>
            <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Full Screen Player Modal Sheet -->
    <div class="full-player-sheet" id="fullPlayerSheet">
      <div class="sheet-bg-blur" id="sheetBgBlur"></div>
      
      <div class="sheet-handle" id="sheetHandle"></div>
      <div class="sheet-header">
        <button class="sheet-dismiss-btn" id="sheetDismissBtn" aria-label="Dismiss">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <span class="sheet-header-title">Now Playing</span>
        <div style="width: 24px;"></div>
      </div>

      <!-- Artwork -->
      <div class="sheet-artwork-container">
        <img class="sheet-artwork paused" id="sheetArtwork" alt="Album Cover" src="icons/icon-512.png">
      </div>

      <!-- Title / Artist -->
      <div class="sheet-track-info">
        <div class="sheet-track-title" id="sheetTrackTitle">Song Title</div>
        <div class="sheet-track-artist" id="sheetTrackArtist">Artist Name</div>
      </div>

      <!-- Scrubber -->
      <div class="scrubber-container">
        <input type="range" class="scrubber-slider" id="scrubberSlider" min="0" max="100" value="0">
        <div class="time-stamps">
          <span id="currentTimeLabel">0:00</span>
          <span id="remainingTimeLabel">-0:00</span>
        </div>
      </div>

      <!-- Controls -->
      <div class="sheet-main-controls">
        <!-- Shuffle -->
        <button class="ctrl-btn" id="shuffleBtn" aria-label="Toggle Shuffle">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"></polyline>
            <line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline>
            <line x1="15" y1="15" x2="21" y2="21"></line>
            <line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
        </button>

        <!-- Previous -->
        <button class="ctrl-btn" id="prevBtn" aria-label="Previous Track">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="19 20 9 12 19 4 19 20"></polygon>
            <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></line>
          </svg>
        </button>

        <!-- Play / Pause Circle -->
        <button class="ctrl-btn play-pause-circle" id="sheetPlayBtn" aria-label="Play/Pause">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" id="sheetPlayIcon">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
        </button>

        <!-- Next -->
        <button class="ctrl-btn" id="nextBtn" aria-label="Next Track">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 4 15 12 5 20 5 4"></polygon>
            <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></line>
          </svg>
        </button>

        <!-- Loop -->
        <button class="ctrl-btn" id="loopBtn" aria-label="Cycle Loop Mode">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" id="loopIcon">
            <polyline points="17 1 21 5 17 9"></polyline>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <polyline points="7 23 3 19 7 15"></polyline>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toast">
      <span id="toastMessage">Imported 5 tracks</span>
    </div>
  </div>

  <!-- Application Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
