<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Music</title>
  
  <!-- iOS PWA Standalone Configuration -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Music">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a0a">

  <!-- Icons & Web Manifest -->
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-title-group">
        <h1>Music</h1>
        <div class="header-subtitle" id="trackCountLabel">0 songs</div>
      </div>
      <div class="header-actions">
        <button class="upload-btn" id="uploadBtn">+ Add</button>
        <input type="file" id="fileInput" multiple accept="audio/mp3,audio/*,.mp3,.m4a,.wav,.flac,.aac" style="display: none;">
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content" id="mainContent">
      <!-- Tabs -->
      <div class="tab-bar">
        <button class="tab-btn active" id="tabSongs">Songs</button>
        <button class="tab-btn" id="tabPlaylists">Playlists</button>
      </div>

      <!-- Songs View -->
      <div id="songsView">
        <!-- Search Bar -->
        <div class="search-container">
          <input type="text" class="search-input" id="searchInput" placeholder="Search...">
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions" id="quickActions" style="display: none;">
          <button class="action-btn" id="playAllBtn">Play All</button>
          <button class="action-btn" id="shuffleAllBtn">Shuffle</button>
        </div>

        <!-- Empty State -->
        <div class="empty-library" id="emptyLibrary">
          <p>No songs added yet.</p>
          <button class="upload-btn" id="emptyUploadBtn">+ Add MP3s</button>
        </div>

        <!-- Track List (Pure text, NO track icons) -->
        <div class="track-list" id="trackList"></div>
      </div>

      <!-- Playlists View -->
      <div id="playlistsView" class="playlists-container">
        <div class="playlist-header-actions">
          <button class="playlist-create-btn" id="newPlaylistBtn">+ New Playlist</button>
        </div>

        <div class="empty-library" id="emptyPlaylists" style="display: none;">
          <p>No playlists yet.</p>
        </div>

        <div class="playlist-grid" id="playlistGrid"></div>
      </div>

      <!-- Playlist Detail View -->
      <div id="playlistDetailView" class="playlist-detail-view">
        <div class="playlist-detail-nav">
          <button class="back-btn" id="playlistBackBtn">← Back</button>
        </div>

        <div class="playlist-detail-hero">
          <div class="playlist-hero-info">
            <h2 class="playlist-hero-title" id="playlistHeroTitle">Playlist</h2>
            <div class="playlist-hero-subtitle" id="playlistHeroSubtitle">0 songs</div>
            <button class="delete-link-btn" id="deletePlaylistBtn">Delete playlist</button>
          </div>
        </div>

        <!-- Playlist Actions -->
        <div class="quick-actions" id="playlistQuickActions" style="display: flex;">
          <button class="action-btn" id="playPlaylistBtn">Play All</button>
          <button class="action-btn" id="shufflePlaylistBtn">Shuffle</button>
        </div>

        <!-- Playlist Track List (Pure text, NO track icons) -->
        <div class="track-list" id="playlistTrackList"></div>
      </div>

      <!-- Status -->
      <div class="storage-status" id="storageStatus">
        100% Offline • Local Storage
      </div>
    </main>

    <!-- Mini Player (Minimal, NO track icon) -->
    <div class="mini-player hidden" id="miniPlayer">
      <div class="mini-info">
        <div class="mini-title" id="miniTitle">Not Playing</div>
        <div class="mini-artist" id="miniArtist">Tap to expand</div>
      </div>
      <div class="mini-controls">
        <button class="mini-ctrl-btn" id="miniPlayBtn" aria-label="Play/Pause">
          <span id="miniPlayText">▶</span>
        </button>
        <button class="mini-ctrl-btn" id="miniNextBtn" aria-label="Next Track">⏭</button>
      </div>
      <div class="mini-progress-bar">
        <div class="mini-progress-fill" id="miniProgressFill"></div>
      </div>
    </div>

    <!-- Full Screen Player Modal Sheet -->
    <div class="full-player-sheet" id="fullPlayerSheet">
      <div class="sheet-header">
        <button class="sheet-dismiss-btn" id="sheetDismissBtn" aria-label="Dismiss">✕</button>
        <span class="sheet-header-title">Now Playing</span>
        <button class="sheet-menu-btn" id="sheetTrackMenuBtn" aria-label="Options">•••</button>
      </div>

      <!-- Artwork (Defaults to App Icon) -->
      <div class="sheet-artwork-container">
        <img class="sheet-artwork paused" id="sheetArtwork" alt="Cover" src="icons/icon-512.png">
      </div>

      <!-- Title / Artist -->
      <div class="sheet-track-info">
        <div class="sheet-track-title" id="sheetTrackTitle">Song Title</div>
        <div class="sheet-track-artist" id="sheetTrackArtist">Artist Name</div>
      </div>

      <!-- Scrubber -->
      <div class="scrubber-container">
        <input type="range" class="scrubber-slider" id="scrubberSlider" min="0" max="100" value="0">
        <div class="time-stamps">
          <span id="currentTimeLabel">0:00</span>
          <span id="remainingTimeLabel">-0:00</span>
        </div>
      </div>

      <!-- Main Controls (Simplistic, Bare Bones) -->
      <div class="sheet-main-controls">
        <button class="ctrl-btn-text" id="shuffleBtn">Shuffle</button>
        <button class="ctrl-btn" id="prevBtn" aria-label="Previous">⏮</button>
        <button class="ctrl-btn play-circle" id="sheetPlayBtn" aria-label="Play/Pause">
          <span id="sheetPlayText">▶</span>
        </button>
        <button class="ctrl-btn" id="nextBtn" aria-label="Next">⏭</button>
        <button class="ctrl-btn-text" id="loopBtn">Loop</button>
      </div>
    </div>

    <!-- Modal: Create Playlist -->
    <div class="modal-overlay" id="createPlaylistModal">
      <div class="modal-card">
        <h3>New Playlist</h3>
        <input type="text" class="modal-input" id="playlistNameInput" placeholder="Playlist title" maxlength="40">
        <div class="modal-actions">
          <button class="modal-btn cancel" id="cancelPlaylistBtn">Cancel</button>
          <button class="modal-btn confirm" id="confirmPlaylistBtn">Create</button>
        </div>
      </div>
    </div>

    <!-- Action Sheet: Song Options -->
    <div class="action-sheet-overlay" id="actionSheetOverlay">
      <div class="action-sheet" id="actionSheet">
        <div class="action-sheet-header" id="actionSheetHeader">Song Options</div>
        <div class="action-sheet-list" id="actionSheetList"></div>
        <button class="action-sheet-cancel" id="actionSheetCancelBtn">Cancel</button>
      </div>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toast">
      <span id="toastMessage">Done</span>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
